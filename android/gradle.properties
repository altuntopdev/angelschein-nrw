org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# The project lives under a path with Turkish/German characters (İş, ü, ...).
# AGP's path check only warns about Windows build flakiness from non-ASCII
# paths — it isn't a hard requirement — so this is the documented opt-out
# rather than a real fix for anything broken.
android.overridePathCheck=true
