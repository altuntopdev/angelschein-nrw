# Builds the VoiceCam debug APK and attaches it to the run as a downloadable
# artifact, so the app can be installed without a local Android SDK.
name: VoiceCam APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'voice_cam_android/**'
      - '.github/workflows/voicecam-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # packages: '' skips the action's default "tools" package, which the
      # current command-line tools no longer ship; the SDK bits the build needs
      # are fetched by Gradle once the licenses are accepted.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Unit tests
        working-directory: voice_cam_android
        run: ./gradlew test

      - name: Build debug APK
        working-directory: voice_cam_android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: voicecam-debug-apk
          path: voice_cam_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # A release asset can be downloaded and installed straight from a phone
      # browser; a run artifact is a login-walled zip.
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp voice_cam_android/app/build/outputs/apk/debug/app-debug.apk voicecam.apk
          gh release delete voicecam-latest --yes --cleanup-tag || true
          gh release create voicecam-latest voicecam.apk \
            --target "$GITHUB_SHA" \
            --title "VoiceCam APK" \
            --notes "Sesli komutla video kaydeden mini uygulama. Telefonda bu dosyayi indirip kur (bilinmeyen kaynaklara izin vermen gerekir)."
